packages:
  - "packages/*"
  - "examples/*"
  - "examples/originals/*"

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - "@solidjs/vite-plugin"
  - '@solidjs/signals@2.0.0-rc.17'
  - '@solidjs/web@2.0.0-rc.17'
  - solid-js@2.0.0-rc.17
  - '@solidjs/compiler-darwin-arm64@2.0.0-rc.17'
  - '@solidjs/compiler-darwin-x64@2.0.0-rc.17'
  - '@solidjs/compiler-linux-arm64-gnu@2.0.0-rc.17'
  - '@solidjs/compiler-linux-x64-gnu@2.0.0-rc.17'
  - '@solidjs/compiler-wasm32-wasi@2.0.0-rc.17'
  - '@solidjs/compiler-win32-x64-msvc@2.0.0-rc.17'
  - '@solidjs/compiler@2.0.0-rc.17'

# Published dependencies use real ranges; link those ranges inside this workspace.
linkWorkspacePackages: true
